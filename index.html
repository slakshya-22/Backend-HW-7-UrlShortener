<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        input {
            padding: 10px;
            width: 300px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Simple URL Shortener</h1>
    <input type="text" id="urlInput" placeholder="Enter URL to shorten">
    <button onclick="shortenUrl()">Shorten URL</button>

    <div class="result" id="result"></div>

    <script>
        async function shortenUrl() {
            const urlInput = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');

            if (urlInput) {
                try {
                    const response = await fetch('/shorten-url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ originalUrl: urlInput })
                    });

                    const data = await response.json();
                    resultDiv.innerHTML = `Shortened URL: <a href="${data.shortenedUrl}" target="_blank">${data.shortenedUrl}</a>`;
                } catch (error) {
                    resultDiv.textContent = 'Something went wrong, please try again.';
                }
            } else {
                resultDiv.textContent = 'Please enter a URL.';
            }
        }
    </script>
</body>
</html>
